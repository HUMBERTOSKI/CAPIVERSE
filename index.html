<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas Cloud — UAB FIT</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Imágenes superiores -->
    <div class="top-image left">
        <img src="imagenes/capibara1.gif" alt="Capibara 1">
    </div>
    <div class="top-image right">
        <img src="imagenes/capibara2.gif" alt="Capibara 2">
    </div>

    <!-- Imágenes inferiores -->
    <div class="bottom-image left">
        <img src="imagenes/capibara3.gif" alt="Capibara 3">
    </div>
    <div class="bottom-image center">
        <img src="imagenes/capibara5.gif" alt="Capibara 5">
    </div>
    <div class="bottom-image right">
        <img src="imagenes/capibara4.gif" alt="Capibara 4">
    </div>

    <!-- Encabezado -->
    <header>
        <h1>Tareas Colaborativas en Tiempo Real</h1>
        <p class="subtitulo">Cloud Computing — UAB FIT | Tecnologías Emergentes</p>
    </header>

    <!-- Contenido principal -->
    <main>
        <section class="formulario">
            <h2>Nueva Tarea</h2>
            <div class="input-group">
                <input type="text" id="titulo" placeholder="Título de la tarea" required>
                <input type="text" id="responsable" placeholder="Responsable" required>
                <button onclick="agregarTarea()">Agregar Tarea</button>
            </div>
        </section>

        <section class="lista">
            <h2>Lista de Tareas <span id="contador">(0)</span></h2>
            <div id="tareas-container">
                <p class="vacio">Cargando tareas...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
